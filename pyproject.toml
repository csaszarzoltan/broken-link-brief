[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brokenlinkbrief"
version = "0.7.0"
description = "Compact broken link scanner with JSON/CSV/Markdown/JSONL export"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "Zoltan Csaszar", email = "csaszar.zoltan@gmail.com"}
]
keywords = ["broken-links", "link-checker", "web-scanner", "seo", "monitoring"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/csaszarzoltan/brokenlinkbrief"
Repository = "https://github.com/csaszarzoltan/brokenlinkbrief"
Issues = "https://github.com/csaszarzoltan/brokenlinkbrief/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM"]
