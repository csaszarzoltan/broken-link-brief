[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brokenlinkbrief"
version = "1.5.0"
description = "Compact broken link scanner with JSON/CSV/Markdown/JSONL export"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Zoltan Csaszar", email = "csaszar.zoltan@gmail.com"}
]
keywords = ["broken-links", "link-checker", "web-scanner", "seo", "monitoring"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Software Development :: Testing",
]

[project.scripts]
brokenlinkbrief = "brokenlinkbrief.cli:main"

[project.urls]
Homepage = "https://github.com/csaszarzoltan/brokenlinkbrief"
Repository = "https://github.com/csaszarzoltan/brokenlinkbrief"
Issues = "https://github.com/csaszarzoltan/brokenlinkbrief/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
    "pyyaml>=6.0",
]
playwright = [
    "playwright>=1.40",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM"]

[tool.ruff.lint.isort]
# Explicit first-party package: ruff >=0.6 auto-detects the src/ layout, but
# older versions (e.g. 0.5.7) do not and mis-classify `brokenlinkbrief`
# imports as third-party, producing spurious I001. Pinning it makes the
# import-sorting result identical across ruff versions.
known-first-party = ["brokenlinkbrief"]

[tool.ruff.lint.pep8-naming]
# `do_*` methods are the http.server.BaseHTTPRequestHandler protocol — the
# uppercase verb suffix is the stdlib API contract, not a naming violation.
ignore-names = ["do_GET", "do_POST", "do_PUT", "do_DELETE", "do_HEAD"]

# E501 remaining lines are all inside string literals (embedded HTML/CSS/SQL
# templates, test fixtures) that ruff format cannot reflow without changing
# string content. Verified: 0 non-string lines exceed 88 chars. See
# docs/decisions/refactor-baseline-2026-08-13.md for the audit trail.
[tool.ruff.lint.per-file-ignores]
"src/brokenlinkbrief/app.py" = ["E501"]
"src/brokenlinkbrief/findings.py" = ["E501"]
"src/brokenlinkbrief/governance.py" = ["E501"]
"tests/test_scan_history_schema.py" = ["E501"]
"tests/test_history.py" = ["E501"]
"tests/test_diff_alerts.py" = ["E501"]
"tools/_seed_portfolio_demo.py" = ["E501"]