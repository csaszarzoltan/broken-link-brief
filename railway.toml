# =============================================================================
# BrokenLinkBrief — Railway deployment configuration
# =============================================================================
# Environment variables (set in Railway dashboard):
#   PORT                        — Bind port (Railway sets this automatically)
#   BROKENLINKBRIEF_SCAN_TOKEN  — Bearer token for API auth (optional)
#   BROKENLINKBRIEF_LOG_FILE    — Path to JSONL log file (optional)
# =============================================================================

[build]
builder = "DOCKERFILE"
dockerfilePath = "infra/Dockerfile"

[deploy]
startCommand = "sh -c 'python -m brokenlinkbrief.app'"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[environments.production]
variables = {ENVIRONMENT = "production", LOG_LEVEL = "info", PYTHONUNBUFFERED = "1"}

[environments.staging]
variables = {ENVIRONMENT = "staging", LOG_LEVEL = "debug"}
